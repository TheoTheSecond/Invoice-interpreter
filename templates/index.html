<!doctype html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">

    <title>Invoice AI v0.1</title>

    <link href="/static/style.css?v=4" rel="stylesheet">
</head>

<body>

<main>

    <header>
        <h1>
            Frontend
            <small>v0.1</small>
        </h1>

        <label class="upload">
            Ladda upp XML
            <input
                    accept=".xml"
                    id="files"
                    multiple
                    type="file"
            >
        </label>
    </header>


    <section class="grid">

        <aside>
            <input
                    id="search"
                    placeholder="Sök filnamn, leverantör eller fakturanr"
            >

            <div id="list"></div>
        </aside>


        <article id="detail">
            <p>Välj eller ladda upp en faktura.</p>
        </article>

    </section>


    <section class="chat">

        <h2>Fråga AI</h2>

        <div id="messages">
            <div class="chat-placeholder">
                Ställ en fråga om dina fakturor.
            </div>
        </div>

        <div class="ask">
            <input
                    autocomplete="off"
                    id="question"
                    placeholder="Skriv en fråga..."
            >

            <button id="ask">
                Fråga
            </button>
        </div>

    </section>

</main>

<script src="/static/app.js?v=4"></script>

</body>
</html>
